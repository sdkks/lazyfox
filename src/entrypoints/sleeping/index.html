<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Sleeping Tab — LazyFox</title>
  </head>
  <body>
    <main class="sleeping-container">
      <img
        id="favicon"
        class="favicon"
        src=""
        alt=""
        width="48"
        height="48"
      />

      <a id="tab-title" class="tab-title" href="#">Loading...</a>
      <a id="tab-url" class="tab-url" href="#">...</a>

      <p id="sleep-time" class="sleep-time" aria-live="polite">
        Sleeping since: ...
      </p>

      <button id="btn-wake" class="btn-wake" autofocus>
        WAKE UP
      </button>

      <p class="click-hint">Click anywhere to wake</p>

      <p id="error-message" class="error-message" role="alert"></p>
    </main>

    <footer class="footer">
      LazyFox &middot; v1.0.0
    </footer>

    <script src="./main.ts" type="module"></script>
  </body>
</html>
